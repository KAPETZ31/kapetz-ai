name: Build KAPETZ AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip KAPETZ project
        run: |
          unzip -o kapetz-ai-oct-9-2026-9-55-15-pm.zip -d temp_extract
          cp -r temp_extract/*/* ./ 2>/dev/null || cp -r temp_extract/* ./ 2>/dev/null || true
          cp -r temp_extract/. . 2>/dev/null || true
          ls -la
          ls -la app || echo "checking app"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAPETZ-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
