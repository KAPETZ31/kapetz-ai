name: Build KAPETZ AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip and Fix Structure
        run: |
          rm -rf app src build.gradle.kts settings.gradle.kts gradle.properties wrapper 2>/dev/null || true
          unzip -o "kapetz-ai-oct-9-2026-9-55-15-pm.zip"
          ls -la
          if [ -d "temp_extract" ]; then
            REAL_APP=$(find temp_extract -type d -name "app" | head -1)
            REAL_ROOT=$(dirname "$REAL_APP")
            cp -rf $REAL_ROOT/* ./
            cp -rf $REAL_ROOT/.* ./ 2>/dev/null || true
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAPETZ-AI-APK
          path: app/build/outputs/apk/debug/*.apk
