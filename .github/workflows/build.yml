name: Build KAPETZ AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip and Fix Structure
        run: |
          echo "=== Before ==="
          ls -la
          ZIP_FILE=$(ls *.zip | head -1)
          echo "ZIP: $ZIP_FILE"
          rm -rf app gradle gradlew build.gradle.kts settings.gradle.kts gradle.properties temp_extract 2>/dev/null || true
          unzip -o "$ZIP_FILE"
          echo "=== After unzip ==="
          ls -la
          find . -type d -maxdepth 4 | head -20
          APP_PATH=$(find . -type d -name "app" | grep -v ".git" | head -1)
          echo "APP_PATH: $APP_PATH"
          ROOT_DIR=$(dirname "$APP_PATH")
          echo "ROOT_DIR: $ROOT_DIR"
          if [ "$ROOT_DIR" != "." ] && [ "$ROOT_DIR" != "" ]; then
            echo "Moving files from $ROOT_DIR to root..."
            cp -rf $ROOT_DIR/* ./
            cp -rf $ROOT_DIR/.* ./ 2>/dev/null || true
          fi
          echo "=== Final ==="
          ls -la
          ls -la gradlew
          ls -la app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAPETZ-AI-APK
          path: app/build/outputs/apk/debug/*.apk
